      <h1>Help</h1>
      <p>
        Two dice are rolled each round. The total is <strong>even</strong> (Cho) or <strong>odd</strong> (Han).
        Place a bet, then choose Cho or Han before the cup is lifted.
      </p>
      <p>
        Wins add your bet to the purse; the house keeps a <strong>10%</strong> fee on winnings. Losses forfeit the bet.
      </p>
